<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="800px" version="1.1" viewBox="0 0 1400 800" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#6A2431" height="800" rx="24" width="1400" x="0" y="0" /><rect fill="#F7F3EC" height="728" rx="74" width="1328" x="36" y="36" /><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="90" y="100">BEYOND THE MESH  /  01</text><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="end" x="1308" y="100">FIGURE 05  /  DECISION</text><text fill="#392B30" font-family="DejaVu Sans, Arial, sans-serif" font-size="51" font-weight="700" text-anchor="start" x="90" y="185">Solve the problem at the right layer.</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start" x="90" y="228">One system, three different responsibility boundaries.</text><rect fill="#E6ECE1" height="236" rx="34" stroke="#72957D" stroke-width="2" width="382" x="90" y="304" /><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="118" y="352">KUBERNETES</text><text fill="#392B30" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="118" y="418">Service discovery</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="118" y="458">Virtual IP + endpoints</text><rect fill="#F8E6DD" height="236" rx="34" stroke="#B45F49" stroke-width="2" width="382" x="508" y="304" /><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="536" y="352">APPLICATION</text><text fill="#392B30" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="536" y="418">Business-safe retries</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="536" y="458">Timeouts + idempotency</text><rect fill="#F0E3EB" height="236" rx="34" stroke="#D99DA5" stroke-width="2" width="382" x="926" y="304" /><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="954" y="352">PROXY / MESH</text><text fill="#392B30" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="954" y="418">Consistent traffic policy</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="954" y="458">Workload identity / telemetry</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="90" y="592">Starting points, not mutually exclusive boxes — libraries, gateways, and CNIs overlap in practice.</text><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="90" y="644">Decision for this 4-service baseline: keep it mesh-free until a concrete requirement justifies the cost.</text><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="90" y="722">DECISION  /  NOT A PRODUCT ENDORSEMENT</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="1308" y="722">lowono.com  /  GitHub: Lionelsan95/beyond_service_mesh</text></svg>