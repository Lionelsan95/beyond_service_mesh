<svg baseProfile="full" height="800px" version="1.1" viewBox="0 0 1400 800" width="1400px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#6A2431" height="800" rx="24" width="1400" x="0" y="0" /><rect fill="#F7F3EC" height="728" rx="74" width="1328" x="36" y="36" /><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" x="90" y="100">BEYOND THE MESH  /  01</text><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="end" x="1308" y="100">FIGURE 04  /  MECHANISM</text><text fill="#392B30" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" text-anchor="start" x="90" y="185">Order timed out before Payment responded.</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start" x="90" y="228">Simplified observed caller-side sequence; server-side cancellation was not established.</text><rect fill="#FFFFFF" height="95" rx="24" stroke="#72957D" stroke-width="2" width="260" x="88" y="314" /><text fill="#392B30" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="218.0" y="358.5">ORDER</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="218.0" y="392.5">2 s HTTP client timeout</text><rect fill="#F8E6DD" height="95" rx="24" stroke="#B45F49" stroke-width="2" width="260" x="944" y="314" /><text fill="#392B30" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="1074.0" y="358.5">PAYMENT</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="1074.0" y="392.5">2.5 s injected delay</text><line stroke="#6A2431" stroke-width="4" x1="348" x2="936" y1="359" y2="359" /><polygon fill="#6A2431" points="936,359 924.9171812132264,365.79493397609855 924.9171812132264,352.20506602390145" /><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="646" y="338">t = 0  •  HTTP request</text><line stroke="#72957D" stroke-dasharray="7 7" stroke-width="3" x1="218" x2="218" y1="410" y2="575" /><line stroke="#B45F49" stroke-dasharray="7 7" stroke-width="3" x1="1074" x2="1074" y1="410" y2="586" /><line stroke="#B45F49" stroke-dasharray="9 7" stroke-width="3" x1="218" x2="1074" y1="494" y2="494" /><circle cx="218" cy="494" fill="#B45F49" r="8" /><rect fill="#B45F49" height="52" rx="14" width="396" x="445" y="468" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" x="643" y="502">≈ 2 s  •  Client timeout</text><rect fill="#F8E6DD" height="90" rx="24" stroke="#B45F49" stroke-width="2" width="495" x="97" y="575" /><text fill="#392B30" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="344.5" y="617.0">ORDER RETURNS HTTP 502</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="344.5" y="651.0">Application-specific failure mapping</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start" x="743" y="633">What Payment did after cancellation was not measured.</text><text fill="#6A2431" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="90" y="722">TIMEOUT ≠ KUBERNETES SERVICE FAILURE</text><text fill="#75686A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" x="1308" y="722">lowono.com  /  GitHub: Lionelsan95/beyond_service_mesh</text></svg>