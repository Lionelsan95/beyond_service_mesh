name: baseline-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.0'}
      - run: go test ./...
        working-directory: apps
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize platform/base >/dev/null
      - run: bash -n scripts/*.sh
      - run: scripts/validate-scenario-01-evidence.sh
