apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service, namespace: btm-lab, labels: {app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: beyond-the-mesh, app.kubernetes.io/version: baseline}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: order-service}}
  template:
    metadata: {labels: {app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: beyond-the-mesh}}
    spec: {automountServiceAccountToken: false, securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}, containers: [{name: order-service, image: btm/order-service:0.1.0, imagePullPolicy: IfNotPresent, ports: [{name: http, containerPort: 8080}], securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}, resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 64Mi}}, readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 1}, livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3}}]}
---
